name: ProcureX quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: procurex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-production.txt
      - run: pip install -r backend/requirements-production.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest

  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q backend

  migration-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-production.txt
      - run: pip install -r backend/requirements-production.txt
      - name: Validate single head and upgrade chain
        run: python backend/scripts/validate_migrations.py

  database-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-production.txt
      - run: pip install -r backend/requirements-production.txt
      - name: Create migrated CI database
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/procurex-ci.db
        run: alembic -c alembic.ini upgrade head
      - name: Verify SQLite integrity and foreign keys
        run: python backend/scripts/check_sqlite_integrity.py /tmp/procurex-ci.db

  backend-tests-postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: procurex
          POSTGRES_PASSWORD: procurex
          POSTGRES_DB: procurex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U procurex"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://procurex:procurex@localhost:5432/procurex
      APP_ENV: test
      APP_SURFACE: full
      CORS_ORIGINS: http://localhost:3000
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-production.txt
      - run: pip install -r requirements-production.txt
        working-directory: backend
      - name: Apply migrations to PostgreSQL
        working-directory: backend
        run: alembic -c alembic.ini upgrade head
      - name: Boot the app against PostgreSQL and hit real endpoints
        working-directory: backend
        run: python scripts/postgres_smoke_test.py

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --package-lock=false --no-audit --no-fund
        working-directory: frontend
      # Avoid competing jsdom/Radix suites exhausting per-test timeouts.
      - run: npm run test:ci -- --runInBand
        working-directory: frontend

  full-erp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --package-lock=false --no-audit --no-fund
        working-directory: frontend
      - name: Build full local ERP bundle
        working-directory: frontend
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"
        run: npm run build

  public-only-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --package-lock=false --no-audit --no-fund
        working-directory: frontend
      - name: Build public request bundle
        working-directory: frontend
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"
          REACT_APP_PUBLIC_API_URL: https://api-staging.invalid
        run: npm run build:public
      - name: Reject internal ERP routes from public bundle
        working-directory: frontend
        run: npm run verify:public-build

  release-gate:
    if: always()
    needs:
      - backend-tests
      - python-compile
      - migration-validation
      - database-integrity
      - backend-tests-postgres-smoke
      - frontend-tests
      - full-erp-build
      - public-only-build
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality check
        env:
          BACKEND_TESTS: ${{ needs.backend-tests.result }}
          PYTHON_COMPILE: ${{ needs.python-compile.result }}
          MIGRATIONS: ${{ needs.migration-validation.result }}
          DATABASE: ${{ needs.database-integrity.result }}
          POSTGRES_SMOKE: ${{ needs.backend-tests-postgres-smoke.result }}
          FRONTEND_TESTS: ${{ needs.frontend-tests.result }}
          ERP_BUILD: ${{ needs.full-erp-build.result }}
          PUBLIC_BUILD: ${{ needs.public-only-build.result }}
        run: |
          test "$BACKEND_TESTS" = success
          test "$PYTHON_COMPILE" = success
          test "$MIGRATIONS" = success
          test "$DATABASE" = success
          test "$POSTGRES_SMOKE" = success
          test "$FRONTEND_TESTS" = success
          test "$ERP_BUILD" = success
          test "$PUBLIC_BUILD" = success
