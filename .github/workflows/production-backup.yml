name: Production PostgreSQL backup

on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    container: postgres:17
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
    steps:
      - name: Install S3 client
        run: apt-get update && apt-get install -y --no-install-recommends awscli ca-certificates
      - name: Create encrypted-in-transit logical backup
        run: |
          set -eu
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          backup="procurex-${stamp}.dump"
          pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL" --file "$backup"
          pg_restore --list "$backup" >/dev/null
          sha256sum "$backup" > "${backup}.sha256"
          aws s3 cp "$backup" "s3://${R2_BACKUP_BUCKET}/postgres/${backup}" --endpoint-url "$R2_ENDPOINT_URL"
          aws s3 cp "${backup}.sha256" "s3://${R2_BACKUP_BUCKET}/postgres/${backup}.sha256" --endpoint-url "$R2_ENDPOINT_URL"
